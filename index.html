<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <title>Order Summary</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="main">
      <div class="container">
        <img class="hero" src="./images/illustration-hero.svg" alt="Illustration of a person dancing while listening to music" />

        <div class="content">
          <h1 class="heading">Order Summary</h1>
          <p class="summary-para">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>

          <div class="plan">
            <img class="plan-icon" src="./images/icon-music.svg" alt="" />
            <div class="plan-text">
              <h3>Annual Plan</h3>
              <p>$59.99/year</p>
            </div>
            <div class="change-link">
              <a href="#">Change</a>
            </div>
          </div>

          <button class="proceed-btn" type="button">Proceed to Payment</button>
          <button class="cancel-order" type="button">Cancel Order</button>
        </div>
      </div>

      <footer class="attribution">
        Challenge by <a href="https://www.crio.do" target="_blank" rel="noopener noreferrer">Crio.do</a>.
        Coded by <a href="https://github.com/ejaz-ahamed" target="_blank" rel="noopener noreferrer">ejaz-ahamed</a>.
      </footer>
    </main>
  </body>
</html>
